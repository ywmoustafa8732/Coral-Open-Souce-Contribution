plugins {
  id 'org.springframework.boot' version '2.7.18'
  id 'io.spring.dependency-management' version '1.1.4'
  id 'java'
}


// Ref: https://docs.gradle.org/current/userguide/upgrading_version_6.html?_ga=2.55190571.1487781572.1677273009-780026602.1675378719#publishing_spring_boot_applications
configurations {
  [apiElements, runtimeElements].each {
    it.outgoing.artifacts.removeIf { it.buildDependencies.getDependencies(null).contains(jar) }
    it.outgoing.artifact(bootJar)
  }
}

repositories {
  maven { url "https://conjars.org/repo" }
}

// Exclusions required to fix issue of multiple bindings on the class path
configurations.all {
  exclude module: 'slf4j-log4j12'
  exclude group: 'javax.servlet'
  // Hive pulls in log4j-slf4j-impl, which conflicts with Spring Boot's log4j-to-slf4j bridge
  exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
  // Old Jetty jars from Hive confuse Spring Boot's embedded Tomcat auto-configuration
  exclude group: 'org.eclipse.jetty.aggregate', module: 'jetty-all'
  exclude group: 'org.mortbay.jetty', module: 'jetty'
  exclude group: 'org.mortbay.jetty', module: 'jetty-util'
  exclude group: 'org.eclipse.jetty.orbit', module: 'javax.servlet'
}

dependencies {
  implementation project(':coral-common')
  implementation project(':coral-hive')
  implementation project(':coral-incremental')
  implementation project(':coral-trino')
  implementation project(':coral-spark')
  implementation project(':coral-visualization')

  implementation(deps.'hive'.'hive-exec-core') {
    exclude group: 'org.apache.calcite', module: 'calcite-core'
  }
  implementation deps.'hadoop'.'hadoop-mapreduce-client-core'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  // Need to add this to avoid class not found issue while setting up local metastore
  implementation 'com.esotericsoftware.kryo:kryo:2.22'
}

tasks.named('bootRun') {
  jvmArgs = [
    '--add-opens=java.base/java.lang=ALL-UNNAMED',
    '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
    '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
    '--add-opens=java.base/java.util=ALL-UNNAMED',
    '--add-opens=java.base/java.io=ALL-UNNAMED',
    '--add-opens=java.base/java.net=ALL-UNNAMED',
    '--add-opens=java.base/java.nio=ALL-UNNAMED',
    '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED'
  ]
  systemProperty 'hive.cbo.enable', 'false'
  systemProperty 'hive.exec.mode.local.auto', 'false'
  systemProperty 'hive.metastore.disallow.incompatible.col.type.changes', 'false'
}
